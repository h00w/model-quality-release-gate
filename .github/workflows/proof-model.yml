name: Production AI Proof Model

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: Assess five-level proof
        run: make proof
      - name: Upload proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-ai-proof
          path: evidence/out/current/
