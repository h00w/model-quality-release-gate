name: Phase 4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Install Phase 4 Python dependencies
        run: pip install 'huggingface_hub>=0.35' 'gradio>=5.49,<6' 'pandas>=2.2'

      - name: Run UI, release-policy and post-training tests
        run: npm test

      - name: Validate versioned post-training experiment artifact
        run: node -e "const a=JSON.parse(require('fs').readFileSync('experiments/post-training/exp-sft-001.json','utf8')); if(a.artifactType!=='post-training-experiment'||a.decision!=='INVESTIGATE') process.exit(1); console.log(a.experiment.id,a.decision)"

      - name: Run Phase 3 machine-readable gate tests
        run: node --test scripts/release-gate.node-test.mjs

      - name: Run Phase 4 deterministic engine tests
        working-directory: huggingface-space
        run: python -m unittest -v test_phase4_engine.py

      - name: Generate sample release evidence
        run: node scripts/release-gate.mjs release/candidate-release.json artifacts/release-gate

      - name: Verify sample evidence checksums
        working-directory: artifacts/release-gate
        run: sha256sum --check checksums.sha256

      - name: Build production UI
        run: npm run build

      - name: Validate Hugging Face Space source
        run: python -m py_compile huggingface-space/app.py huggingface-space/phase4_engine.py
