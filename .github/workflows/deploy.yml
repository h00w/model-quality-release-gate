name: Phase 3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Run UI release-policy and Phase 2 tests
        run: npm test

      - name: Run Phase 3 machine-readable gate tests
        run: node --test scripts/release-gate.node-test.mjs

      - name: Generate sample release evidence
        run: node scripts/release-gate.mjs release/candidate-release.json artifacts/release-gate

      - name: Verify sample evidence checksums
        working-directory: artifacts/release-gate
        run: sha256sum --check checksums.sha256

      - name: Build production UI
        run: npm run build

      - name: Validate Hugging Face Space source
        run: python -m py_compile huggingface-space/app.py
